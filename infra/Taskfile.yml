version: '3'

includes:
  packer: tasks/packer.yml
  terragrunt: tasks/terragrunt.yml
  ansible: tasks/ansible.yml

tasks:
  decrypt-secrets:
    desc: "Decrypt secrets file"
    cmds:
      - sops -d ../secrets/secrets.enc.yml > /dev/shm/secrets.yml

  remove-secrets:
    desc: "Remove decrypted secrets file"
    cmds:
      - rm -f /dev/shm/secrets.yml

  prebootstrap:
    desc: "Pre-bootstrap the infrastructure"
    cmds:
      - task: terragrunt:validate-00-prerequisites
      - task: terragrunt:apply-00-prebootstrap

  bootstrap:
    desc: "Bootstrap the infrastructure (Packer -> Terragrunt -> Ansible)"
    cmds:
      - task: packer:all
      - task: terragrunt:validate-01-network
      - task: terragrunt:apply-01-network
      - task: ansible:01-network
      - task: terragrunt:validate-02-core-services
      - task: terragrunt:apply-02-core-services
      - task: ansible:02-core-services

  bootstrap-destroy:
    desc: "Destroy all infrastructure and clean up state"
    cmds:
      - task: terragrunt:destroy