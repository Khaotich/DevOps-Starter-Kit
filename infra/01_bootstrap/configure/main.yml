- name: Install and configure PostgreSQL
  hosts: host
  gather_facts: false
  vars_files:
    - ../../../config/common.yml
    - ../../../config/services/postgresql.yml

  tasks:
    - name: Load PostgreSQL tasks
      ansible.builtin.import_tasks: tasks/postgresql.yml

  handlers:
    - name: Load PostgreSQL handlers
      ansible.builtin.import_tasks: handlers/postgresql.yml


- name: Install and configure Forgejo
  hosts: host
  gather_facts: false
  vars_files:
    - ../../../config/common.yml
    - ../../../config/services/forgejo.yml

  tasks:
    - name: Load Forgejo tasks
      ansible.builtin.import_tasks: tasks/forgejo.yml

  handlers:
    - name: Load Forgejo handlers
      ansible.builtin.import_tasks: handlers/forgejo.yml
