- name: Install HAProxy package
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Deploy HAProxy configuration file
  ansible.builtin.template:
    src: ../templates/haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
  notify: Restart HAProxy

- name: Ensure firewalld allows PostgreSQL port
  ansible.builtin.firewalld:
    port: "{{ postgres.postgres_db_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

- name: Allow HAProxy to make network connections (SELinux)
  ansible.builtin.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true

- name: Enable and start HAProxy service
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started