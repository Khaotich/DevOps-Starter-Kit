- name: Read secrets from Vault KV paths
  community.hashi_vault.vault_read:
    url: "http://{{ vault.vault_service_name }}.{{ dns_prefix }}.{{ dns_domain }}"
    auth_method: approle
    role_id: "{{ approle_creds.VAULT_ROLE_ID }}"
    secret_id: "{{ approle_creds.VAULT_SECRET_ID }}"
    path: "{{ vault_kv_prefix | default('secret/data') }}/{{ item }}"
  register: _vault_read_item
  delegate_to: localhost
  run_once: true
  no_log: true
  loop: "{{ vault_secret_paths }}"
  loop_control:
    label: "{{ item }}"

- name: Store Vault secrets in a dictionary keyed by secret name
  ansible.builtin.set_fact:
    vault_secrets: >-
      {{
        (vault_secrets if (vault_secrets is defined and vault_secrets is mapping) else {})
        | combine({
            item.item: (
              (item.data.data.data | default(item.data.data) | default(item.data) | default({}))
            )
          })
      }}
  loop: "{{ _vault_read_item.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  run_once: true
  no_log: false