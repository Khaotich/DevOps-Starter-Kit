- name: Generate random secrets
  ansible.builtin.set_fact:
    vault_generated_secrets:
      - path: "secret/data/keycloak"
        data:
          client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', '!@#$%^&*()-_=+'], length=32) }}"
          admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', '!@#$%^&*()-_=+'], length=32) }}"
          db_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', '!@#$%^&*()-_=+'], length=32) }}"
      - path: "secret/data/postgres"
        data:
          admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', '!@#$%^&*()-_=+'], length=32) }}"
  run_once: true
  no_log: true

- name: Store generated secrets in Vault KV v2
  community.hashi_vault.vault_write:
    url: "http://{{ vault.vault_service_name }}.{{ dns_prefix }}.{{ dns_domain }}"
    auth_method: approle
    role_id: "{{ approle_creds.VAULT_ROLE_ID }}"
    secret_id: "{{ approle_creds.VAULT_SECRET_ID }}"
    path: "{{ item.path }}"
    data:
      data: "{{ item.data }}"
  loop: "{{ vault_generated_secrets }}"
  loop_control:
    label: "{{ item.path }}"
  delegate_to: localhost
  run_once: true
  no_log: true
