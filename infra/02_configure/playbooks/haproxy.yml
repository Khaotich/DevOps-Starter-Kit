- name: Install and configure HaProxy
  hosts: host
  gather_facts: false
  vars:
    postgres: "{{ lookup('ansible.builtin.file', '../../../config/services/postgresql.yml') | from_yaml }}"
  vars_files:
    - ../../../config/common.yml
    - ../../../config/services/haproxy.yml

  tasks:
    - name: Wait for ssh to accept connections
      import_tasks: ../tasks/common/wait_ssh.yml

    - name: Wait for cloud-init to be fully ready
      import_tasks: ../tasks/common/wait_cloud_init.yml

    - name: Load HaProxy tasks
      ansible.builtin.import_tasks: ../tasks/haproxy.yml

  handlers:
    - name: Load HaProxy handlers
      ansible.builtin.import_tasks: ../handlers/haproxy.yml