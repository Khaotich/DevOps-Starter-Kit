- name: Install and configure VyOS
  hosts: host
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: vyos.vyos.vyos
  vars_files:
    - ../../../config/common.yml
    - ../../../config/services/vyos.yml

  tasks:
    - name: Wait for ssh to accept connections
      import_tasks: ../tasks/common/wait_ssh.yml

    - name: Configure VyOS
      ansible.builtin.import_tasks: ../tasks/vyos/configure_vyos.yml
