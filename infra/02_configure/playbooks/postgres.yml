- name: Install and configure PostgreSQL
  hosts: host
  gather_facts: false
  vars:
    secrets: "{{ lookup('community.sops.sops', '../../../secrets/services/postgres.enc.yml') | from_yaml }}"
  vars_files:
    - ../../../config/common.yml
    - ../../../config/services/postgresql.yml

  tasks:
    - name: Wait for ssh to accept connections
      import_tasks: ../tasks/common/wait_ssh.yml

    - name: Wait for cloud-init to be fully ready
      import_tasks: ../tasks/common/wait_cloud_init.yml

    - name: Load PostgreSQL tasks
      ansible.builtin.import_tasks: ../tasks/postgresql.yml

  handlers:
    - name: Load PostgreSQL handlers
      ansible.builtin.import_tasks: ../handlers/postgresql.yml